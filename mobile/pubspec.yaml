name: roomadda_mobile
description: "RoomAdda mobile workspace (melos-managed): core (shared) + tenant + host_agent apps. Standalone — not part of the pnpm workspace."
publish_to: "none"
version: 0.1.0

# This is the melos workspace root, not an app. The runnable Flutter packages are
# core/ (shared library), tenant/ (Tenant app) and host_agent/ (Host & Agent app).
# See melos.yaml. Use `melos run get|analyze|test`, or run flutter directly inside
# each package.
environment:
  sdk: ">=3.6.0 <4.0.0"

dev_dependencies:
  melos: ^6.3.0
